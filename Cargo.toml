# CPU drawing helpers: rounded boxes, shadows, linear gradients, an RGBA
# shelf atlas, and RGBA <-> NV12 conversion.
# shaders/compositor.hlsl and shaders/compositor.glsl are included as source
# strings and are not compiled or run.
# Callers: anvil-raster (SDF and gradients) and anvil-video (NV12 planes).

[package]
name = "anvil-gpu"
version = "0.6.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "Tile drawing of rounded boxes, shadows, gradients, and NV12. Linux probes libEGL."
repository = "https://github.com/buntatoes/anvil-gpu"
homepage = "https://github.com/buntatoes/anvil-gpu"
readme = "README.md"
keywords = ["compositor", "sdf", "nv12"]
categories = ["rendering"]
publish = false
