# CPU compositor passes: blurred box shadows, linear and radial gradients,
# RGBA/NV12/I420 frame blits, rounded-box tile quads, an RGBA shelf atlas, and
# RGBA <-> NV12 conversion. shaders/passes.* and shaders/compositor.* are
# included as source strings; on Windows the HLSL is compiled with
# d3dcompiler_47.dll, and nothing runs on a GPU yet.
# Callers: anvil-raster (SDF and gradients, in anvil-engine) and anvil-video (NV12 planes).

[package]
name = "anvil-gpu"
version = "0.8.0"
edition = "2024"
authors = ["Buntato <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "CPU compositor passes for shadows, gradients, and video frames, with GLSL and HLSL versions. Probes EGL and Direct3D 11."
repository = "https://github.com/buntatoes/anvil-gpu"
homepage = "https://github.com/buntatoes/anvil-gpu"
readme = "README.md"
keywords = ["compositor", "sdf", "nv12"]
categories = ["rendering"]
publish = false
