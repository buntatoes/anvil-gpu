# CPU drawing helpers: rounded boxes, shadows, linear gradients, an RGBA
# shelf atlas, and RGBA <-> NV12 conversion.
# shaders/compositor.hlsl and shaders/compositor.glsl are included as source
# strings and are not compiled or run.
# Callers: flux-raster (SDF and gradients) and flux-video (NV12 planes).

[package]
name = "flux-gpu"
version = "0.4.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "CPU drawing of rounded boxes, shadows, gradients, and NV12. Shader files are source text only."
repository = "https://github.com/buntatoes/flux-gpu"
homepage = "https://github.com/buntatoes/flux-gpu"
readme = "README.md"
keywords = ["compositor", "sdf", "nv12"]
categories = ["rendering"]
