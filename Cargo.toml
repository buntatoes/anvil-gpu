# CPU compositor passes: blurred box shadows, linear and radial gradients,
# RGBA/NV12/I420 frame blits, rounded-box tile quads, an RGBA shelf atlas, and
# RGBA <-> NV12 conversion. shaders/passes.* and shaders/compositor.* are
# included as source strings. The passes run through OpenGL 3.3 on Linux and
# Direct3D 11 on Windows when a self-test matches the CPU.
# Callers: anvil-raster (Compositor and tile quads, in anvil-engine) and anvil-video (Compositor and NV12 planes).

[package]
name = "anvil-gpu"
version = "0.9.1"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "Compositor passes for shadows, gradients, and video frames, on the CPU or through OpenGL and Direct3D 11 when the device matches the CPU bytes."
repository = "https://github.com/buntatoes/anvil-gpu"
homepage = "https://github.com/buntatoes/anvil-gpu"
readme = "README.md"
keywords = ["compositor", "sdf", "nv12"]
categories = ["rendering"]
publish = false
